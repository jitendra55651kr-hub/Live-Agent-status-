<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agent Hourly Report - Unit 2</title>
  <!-- SheetJS for Excel/CSV Parsing -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; -webkit-font-smoothing: antialiased; }
    
    body { background-color: #f1f5f9; color: #0f172a; padding: 15px; }
    
    /* Main Top Header */
    header { 
      text-align: center; 
      margin-bottom: 20px; 
      padding: 22px 15px; 
      background: linear-gradient(135deg, #0b1329 0%, #1e293b 100%); 
      border-radius: 16px; 
      border: 1px solid #334155; 
      box-shadow: 0 12px 30px -5px rgba(15, 23, 42, 0.4); 
    }
    h1 { 
      color: #ffffff; 
      font-size: 26px; 
      font-weight: 900; 
      letter-spacing: 1.5px; 
      text-transform: uppercase; 
      margin-bottom: 4px; 
    }
    
    .header-subtitle {
      color: #38bdf8;
      font-size: 14px;
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 16px;
    }
    
    .controls-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    /* Professional Upload Bar */
    .upload-container { 
      display: inline-flex; 
      justify-content: center; 
      align-items: center; 
      background: rgba(15, 23, 42, 0.6);
      padding: 6px;
      border-radius: 40px;
      border: 1px solid rgba(56, 189, 248, 0.2);
    }
    input[type="file"] { display: none; }
    
    .custom-file-upload { 
      background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%); 
      color: #ffffff; 
      padding: 9px 22px; 
      border-radius: 30px; 
      cursor: pointer; 
      font-weight: 800; 
      text-transform: uppercase; 
      font-size: 11px; 
      letter-spacing: 0.8px; 
      border: 1px solid #60a5fa; 
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .upload-icon { width: 14px; height: 14px; fill: currentColor; }

    /* Summary Cards */
    .summary-cards { 
      display: grid; 
      grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); 
      gap: 8px; 
      margin-bottom: 20px; 
    }
    
    .card { 
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); 
      padding: 10px 8px; 
      border-radius: 10px; 
      border: 1px solid #0f172a; 
      border-top: 3px solid #38bdf8; 
      text-align: center; 
    }
    .card h3 { 
      font-size: 10px; 
      color: #ffffff; 
      text-transform: uppercase; 
      margin-bottom: 6px; 
      font-weight: 800; 
      letter-spacing: 0.3px; 
    }
    .card p { 
      font-size: 18px; 
      font-weight: 900; 
      color: #ffffff; 
    }

    /* Team Section */
    .team-section { 
      background: #ffffff; 
      border-radius: 12px; 
      border: 2px solid #334155; 
      margin-bottom: 20px; 
      overflow: hidden; 
      box-shadow: 0 6px 16px rgba(15, 23, 42, 0.1); 
    }
    
    .team-header { 
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); 
      padding: 12px 14px; 
      font-size: 15px; 
      font-weight: 900; 
      color: #ffffff; 
      letter-spacing: 0.8px; 
      border-bottom: 2px solid #334155; 
      text-transform: uppercase; 
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }
    
    /* Responsive Table Container */
    .table-responsive { 
      width: 100%;
      overflow-x: auto; 
      -webkit-overflow-scrolling: touch;
    }
    
    table { width: 100%; border-collapse: collapse; text-align: left; }

    th { 
      background-color: #0f172a; 
      color: #ffffff; 
      padding: 10px 8px; 
      font-weight: 900; 
      border-bottom: 2px solid #334155; 
      border-right: 1.5px solid #334155; 
      text-transform: uppercase; 
      font-size: 10.5px; 
      text-align: center; 
      letter-spacing: 0.3px; 
      user-select: none;
      white-space: normal !important;
      word-wrap: break-word;
      hyphens: auto;
    }

    th:first-child, td:first-child {
      position: sticky;
      left: 0;
      z-index: 2;
      background-color: #ffffff;
    }
    th:first-child {
      background-color: #0f172a;
      z-index: 3;
      text-align: left;
      padding-left: 10px;
    }
    tr:nth-child(even) td:first-child { background-color: #f8fafc; }
    tr:nth-child(odd) td:first-child { background-color: #ffffff; }
    tr:hover td:first-child { background-color: #e0f2fe; }

    th:last-child { border-right: none; }
    
    .sortable-th { cursor: pointer; transition: background 0.2s ease; }
    .sortable-th:hover { background-color: #1e293b; }
    .th-content { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; }
    .sort-icon { 
      display: inline-block; 
      padding: 1px 4px; 
      font-size: 8px; 
      background: #1e293b; 
      border: 1px solid #475569; 
      border-radius: 3px; 
      color: #94a3b8; 
      white-space: nowrap;
    }
    .sortable-th.active-primary .sort-icon { background: #0284c7; color: #ffffff; border-color: #38bdf8; }
    .sortable-th.active-secondary .sort-icon { background: #475569; color: #38bdf8; border-color: #38bdf8; }

    /* Team Filter Button */
    .agent-filter-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      color: #ffffff;
      border: 1px solid #38bdf8;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 9px;
      font-weight: 900;
      cursor: pointer;
      text-transform: uppercase;
      box-shadow: 0 2px 6px rgba(2, 132, 199, 0.3);
    }
    
    td { 
      padding: 8px 8px; 
      border-bottom: 1.5px solid #cbd5e1; 
      border-right: 1.5px solid #cbd5e1; 
      color: #0f172a; 
      font-weight: 700; 
      font-size: 13px; 
      white-space: nowrap;
    }
    td:last-child { border-right: none; }
    
    tr:last-child td { border-bottom: none; }
    tr:nth-child(even) { background-color: #f8fafc; }
    tr:nth-child(odd) { background-color: #ffffff; }
    tr:hover { background-color: #e0f2fe; }
    
    .agent-name { font-weight: 800; color: #0f172a; text-align: left; padding-left: 10px; font-size: 13px; }
    .metric-val { text-align: center; font-size: 13px; color: #0f172a; font-weight: 800; }

    /* Dark Modal Styling */
    .filter-modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(8px);
      z-index: 99999;
      justify-content: center;
      align-items: center;
      padding: 15px;
    }
    .filter-modal-overlay.open { display: flex; }
    
    .filter-modal-card {
      background: #0f172a;
      border-radius: 16px;
      max-width: 480px;
      width: 100%;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.8);
      border: 1px solid #334155;
      overflow: hidden;
    }
    
    .filter-modal-header {
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      padding: 14px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #334155;
    }
    .filter-header-left h2 { font-size: 14px; font-weight: 900; color: #ffffff; text-transform: uppercase; }
    .filter-header-left p { font-size: 10px; color: #38bdf8; font-weight: 700; margin-top: 2px; }
    .close-modal-btn {
      background: #1e293b;
      border: 1px solid #475569;
      color: #94a3b8;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      cursor: pointer;
    }

    .filter-modal-tools {
      padding: 10px 18px;
      background: #162032;
      border-bottom: 1px solid #334155;
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      align-items: center;
    }
    .filter-search-box {
      flex: 1;
      min-width: 140px;
      padding: 7px 10px;
      background: #0f172a;
      border: 1.5px solid #334155;
      border-radius: 6px;
      font-size: 11px;
      color: #ffffff;
      outline: none;
    }
    .quick-action-btn {
      background: #1e293b;
      border: 1px solid #475569;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 9px;
      font-weight: 800;
      cursor: pointer;
      color: #cbd5e1;
      text-transform: uppercase;
    }

    .filter-list-body {
      padding: 12px 18px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 5px;
      max-height: 280px;
    }
    .agent-checkbox-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 700;
      color: #f1f5f9;
      cursor: pointer;
      padding: 7px 10px;
      background: #1e293b;
      border-radius: 6px;
      border: 1px solid #334155;
    }
    .agent-checkbox-label input { width: 15px; height: 15px; accent-color: #0284c7; cursor: pointer; }

    .filter-modal-footer {
      padding: 12px 18px;
      background: #162032;
      border-top: 1px solid #334155;
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }
    .cancel-btn, .apply-btn {
      padding: 7px 14px;
      border-radius: 6px;
      font-weight: 800;
      font-size: 10px;
      text-transform: uppercase;
      cursor: pointer;
    }
    .cancel-btn { background: transparent; color: #94a3b8; border: 1px solid #475569; }
    .apply-btn { background: linear-gradient(135deg, #0284c7 0%, #2563eb 100%); color: #ffffff; border: 1px solid #38bdf8; }
  </style>
</head>
<body>

  <header>
    <h1>AGENT HOURLY REPORT</h1>
    <div class="header-subtitle">UNIT 2</div>
    
    <div class="controls-wrapper">
      <div class="upload-container">
        <label for="fileInput" class="custom-file-upload">
          <svg class="upload-icon" viewBox="0 0 24 24">
            <path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z"/>
          </svg>
          Upload Excel / CSV File
        </label>
        <input type="file" id="fileInput" accept=".csv, .xlsx, .xls">
      </div>
    </div>
  </header>

  <!-- Summary Cards -->
  <div class="summary-cards" id="summaryCards">
    <div class="card"><h3>Total Agents</h3><p id="totAgents">0</p></div>
    <div class="card"><h3>Book Consultation</h3><p id="totBooked">0</p></div>
    <div class="card"><h3>Done Consultation</h3><p id="totDone">0</p></div>
    <div class="card"><h3>Clinic Video Call</h3><p id="totVideoCall">0</p></div>
    <div class="card"><h3>Chk Doc</h3><p id="totChkDoc">0</p></div>
    <div class="card"><h3>FDB</h3><p id="totFdb">0</p></div>
    <div class="card"><h3>Connected FDB</h3><p id="totConnFdb">0</p></div>
    <div class="card"><h3>IMM FDB</h3><p id="totImmFdb">0</p></div>
    <div class="card"><h3>Connected IMM FDB</h3><p id="totConnImmFdb">0</p></div>
  </div>

  <div id="teamsContainer"></div>

  <!-- Team Filter Popup -->
  <div class="filter-modal-overlay" id="filterModalOverlay">
    <div class="filter-modal-card">
      <div class="filter-modal-header">
        <div class="filter-header-left">
          <h2 id="modalTeamTitle">⚡ Filter Team Members</h2>
          <p id="modalTeamSubtitle">Show / Hide active agents</p>
        </div>
        <button class="close-modal-btn" onclick="closeTeamFilterModal()">&times;</button>
      </div>
      <div class="filter-modal-tools">
        <input type="text" class="filter-search-box" id="teamAgentSearchBox" placeholder="Search team member..." oninput="searchTeamAgents()">
        <button class="quick-action-btn" onclick="toggleTeamAll(true)">Select All</button>
        <button class="quick-action-btn" onclick="toggleTeamAll(false)">Unselect All</button>
      </div>
      <div class="filter-list-body" id="teamFilterListBody"></div>
      <div class="filter-modal-footer">
        <button class="cancel-btn" onclick="closeTeamFilterModal()">Cancel</button>
        <button class="apply-btn" onclick="applyTeamFilter()">Apply Filter</button>
      </div>
    </div>
  </div>

  <script>
    const TEAMS = {
      "TEAM JITENDRA": [
        "Saurav Pal", "Md anas", "Renu Gupta", "Shivam verma", 
        "Jogender singh", "Jayshree Choudhary", "Snigdha pal", 
        "Kiran thakur", "Vaishali sisodiya", "ANKUR KUMAR", "Rashi Gupta"
      ],
      "TEAM DEEPTI": [
        "Renu Rani", "Pooja Rathore", "ROSHNI PRAJAPATI", "GARVIT JHA", 
        "Rajni Saini", "Puja Chauhan", "Shivansh tiwari", "Saifur Janam", 
        "Anjali Gupta", "Roshni chouhan", "NIKITA YADAV"
      ],
      "TEAM RAVI": [
        "Jyoti Singh unit 2", "Rajendra Mourya", "Apurv Acharya", 
        "Amit Sharma", "Atul Kumar", "Sumit H", "Piyush Verma", 
        "Shivam Shukla", "Hitesh Kumar", "Samirun Nisha", "Abuzar Akhtar"
      ],
      "TEAM SHIVAM": [
        "Nandani", "Kamni Sharma", "Burhan", 
        "Chandrabhanu", "Munsi Sakil Ahmed", "Ashish Yadav", "Chandrabhanu Sukla",
        "MOHD SHAKIB", "Snehal Sukhadeo Gaikwad", "Kamni Muthoot"
      ],
      "TEAM ISHANT": [
        "Ayushi Saxena", "Harivansh Agarwal", 
        "Smruti Rani Sahoo", "Sushma Chaudhary", "Ashok Pawar", 
        "PRIYA PATIDAR", "YASHWANT SINGH", "Sanjana Khuswaha", "Isha mehta", "Rajesh ."
      ]
    };

    const SORTABLE_COLUMNS = [
      { key: 'booked', label: 'Book Consultation' },
      { key: 'done', label: 'Done Consultation' },
      { key: 'videocall', label: 'Clinic Video Call' },
      { key: 'chkdoc', label: 'Chk Doc' },
      { key: 'fdb', label: 'FDB' },
      { key: 'conn_fdb', label: 'Connected FDB' },
      { key: 'imm_fdb', label: 'IMM FDB' },
      { key: 'conn_imm_fdb', label: 'Connected IMM FDB' }
    ];

    let currentAgentStatsMap = {};
    let excludedAgents = new Set();
    let currentActiveTeamForFilter = null;

    const teamSortState = {};
    function resetAllTeamSorts() {
      Object.keys(TEAMS).forEach(team => {
        teamSortState[team] = {
          primary: { key: 'booked', order: 'desc' },
          secondary: { key: 'imm_fdb', order: 'desc' }
        };
      });
    }
    resetAllTeamSorts();

    document.getElementById('fileInput').addEventListener('change', handleFile);

    function handleFile(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(evt) {
        const data = new Uint8Array(evt.target.result);
        const workbook = XLSX.read(data, { type: 'array' });
        const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
        const rawRows = XLSX.utils.sheet_to_json(firstSheet, { header: 1 });
        processData(rawRows);
      };
      reader.readAsArrayBuffer(file);
    }

    function cleanString(str) {
      if (!str) return '';
      return String(str).toLowerCase().replace(/[^a-z0-9]/g, '');
    }

    function processData(rows) {
      let headerRowIndex = -1;
      let colMap = {};

      for (let i = 0; i < Math.min(20, rows.length); i++) {
        const row = rows[i];
        if (!row) continue;
        
        row.forEach((cell, colIdx) => {
          const val = cleanString(cell);
          if (val === 'agent' || val === 'agentname' || val === 'name') colMap['agent'] = colIdx;
          if (val.includes('booked')) colMap['booked'] = colIdx;
          if (val.includes('done')) colMap['done'] = colIdx;
          if (val.includes('videocall') || val.includes('clinicvideo') || val === 'teledoc') colMap['videocall'] = colIdx;
          if (val.includes('chkdoc') || val.includes('checkdoc')) colMap['chkdoc'] = colIdx;
          
          if (val === 'immfdb') colMap['imm_fdb'] = colIdx;
          else if (val.includes('connectedimmfdb') || val.includes('connimm')) colMap['conn_imm_fdb'] = colIdx;
          else if (val.includes('connectedfdb') || val.includes('connected')) colMap['conn_fdb'] = colIdx;
          else if (val === 'fdb') colMap['fdb'] = colIdx;
        });

        if (colMap['agent'] !== undefined) {
          headerRowIndex = i;
          break;
        }
      }

      if (headerRowIndex === -1) {
        alert("Could not find 'Agent' column in the uploaded sheet.");
        return;
      }

      currentAgentStatsMap = {};

      for (let i = headerRowIndex + 1; i < rows.length; i++) {
        const row = rows[i];
        if (!row || !row[colMap['agent']]) continue;

        const rawName = String(row[colMap['agent']]).trim();
        const cleanName = cleanString(rawName);

        const getNum = (colKey) => {
          if (colMap[colKey] === undefined) return 0;
          const val = parseFloat(row[colMap[colKey]]);
          return isNaN(val) ? 0 : val;
        };

        currentAgentStatsMap[cleanName] = {
          displayName: rawName,
          booked: getNum('booked'),
          done: getNum('done'),
          videocall: getNum('videocall'),
          chkdoc: getNum('chkdoc'),
          fdb: getNum('fdb'),
          conn_fdb: getNum('conn_fdb'),
          imm_fdb: getNum('imm_fdb'),
          conn_imm_fdb: getNum('conn_imm_fdb')
        };
      }

      resetAllTeamSorts();
      renderDashboard();
    }

    function handleTeamSort(teamName, key) {
      const state = teamSortState[teamName];

      if (state.primary.key === key) {
        state.primary.order = (state.primary.order === 'desc') ? 'asc' : 'desc';
      } else if (state.secondary && state.secondary.key === key) {
        state.secondary.order = (state.secondary.order === 'desc') ? 'asc' : 'desc';
      } else {
        state.secondary = { key: state.primary.key, order: state.primary.order };
        state.primary = { key: key, order: (key === 'agent') ? 'asc' : 'desc' };
      }
      renderDashboard();
    }

    function renderDashboard() {
      const container = document.getElementById('teamsContainer');
      container.innerHTML = '';

      let gTotAgents = 0, gTotBooked = 0, gTotDone = 0, gTotVideoCall = 0, 
          gTotChk = 0, gTotFdb = 0, gTotConnFdb = 0, 
          gTotImmFdb = 0, gTotConnImmFdb = 0;

      Object.keys(TEAMS).forEach(teamName => {
        const members = TEAMS[teamName];
        const sortState = teamSortState[teamName];
        const prim = sortState.primary;
        const sec = sortState.secondary;

        const headersHtml = SORTABLE_COLUMNS.map(col => {
          const isPrim = prim && prim.key === col.key;
          const isSec = sec && sec.key === col.key;

          let icon = '⇅';
          let activeClass = 'sortable-th';

          if (isPrim) {
            icon = (prim.order === 'desc') ? '▼' : '▲';
            activeClass = 'sortable-th active-primary';
          } else if (isSec) {
            icon = (sec.order === 'desc') ? '▼ (2nd)' : '▲ (2nd)';
            activeClass = 'sortable-th active-secondary';
          }

          return `
            <th class="${activeClass}" onclick="handleTeamSort('${teamName}', '${col.key}')">
              <div class="th-content">
                <span>${col.label}</span>
                <span class="sort-icon">${icon}</span>
              </div>
            </th>
          `;
        }).join('');

        const isAgentPrim = prim && prim.key === 'agent';
        const agentIcon = isAgentPrim ? (prim.order === 'asc' ? '▲' : '▼') : '⇅';

        const visibleMembers = members.filter(m => !excludedAgents.has(m));

        let teamData = visibleMembers.map(member => {
          gTotAgents++;
          const cleanMem = cleanString(member);
          let stats = currentAgentStatsMap[cleanMem];

          if (!stats) {
            const key = Object.keys(currentAgentStatsMap).find(k => {
              const cleanMemAlt = cleanMem.replace('saurabh', 'saurav');
              const kAlt = k.replace('saurabh', 'saurav');
              return k.includes(cleanMem) || cleanMem.includes(k) || kAlt.includes(cleanMemAlt) || cleanMemAlt.includes(kAlt);
            });
            if (key) stats = currentAgentStatsMap[key];
          }

          const s = stats || {
            booked: 0, done: 0, videocall: 0, 
            chkdoc: 0, fdb: 0, conn_fdb: 0, imm_fdb: 0, conn_imm_fdb: 0
          };

          return { name: member, stats: s };
        });

        teamData.sort((a, b) => {
          const primKey = prim.key;
          const secKey = sec ? sec.key : null;

          if (primKey === 'agent') {
            return prim.order === 'asc' 
              ? a.name.localeCompare(b.name) 
              : b.name.localeCompare(a.name);
          }

          const pA = Number(a.stats[primKey]) || 0;
          const pB = Number(b.stats[primKey]) || 0;

          if (pA > 0 && pB > 0) {
            return prim.order === 'desc' ? (pB - pA) : (pA - pB);
          }
          if (pA > 0 && pB === 0) return -1;
          if (pA === 0 && pB > 0) return 1;

          if (secKey && secKey !== 'agent') {
            const sA = Number(a.stats[secKey]) || 0;
            const sB = Number(b.stats[secKey]) || 0;

            if (sA > 0 && sB > 0) {
              return sec.order === 'desc' ? (sB - sA) : (sA - sB);
            }
            if (sA > 0 && sB === 0) return -1;
            if (sA === 0 && sB > 0) return 1;
          }

          return a.name.localeCompare(b.name);
        });

        let tableRows = '';
        teamData.forEach(item => {
          const member = item.name;
          const s = item.stats;

          gTotBooked += s.booked;
          gTotDone += s.done;
          gTotVideoCall += s.videocall;
          gTotChk += s.chkdoc;
          gTotFdb += s.fdb;
          gTotConnFdb += s.conn_fdb;
          gTotImmFdb += s.imm_fdb;
          gTotConnImmFdb += s.conn_imm_fdb;

          const fmt = (val) => (!val || val === 0) ? '' : val;

          tableRows += `
            <tr>
              <td class="agent-name">${member}</td>
              <td class="metric-val">${fmt(s.booked)}</td>
              <td class="metric-val">${fmt(s.done)}</td>
              <td class="metric-val">${fmt(s.videocall)}</td>
              <td class="metric-val">${fmt(s.chkdoc)}</td>
              <td class="metric-val">${fmt(s.fdb)}</td>
              <td class="metric-val">${fmt(s.conn_fdb)}</td>
              <td class="metric-val">${fmt(s.imm_fdb)}</td>
              <td class="metric-val">${fmt(s.conn_imm_fdb)}</td>
            </tr>
          `;
        });

        const teamHtml = `
          <div class="team-section">
            <div class="team-header">
              <span>${teamName} (${teamData.length}/${members.length})</span>
              <button type="button" class="agent-filter-btn" onclick="openTeamFilterModal('${teamName}')">
                ⚡ Filter Agents
              </button>
            </div>
            <div class="table-responsive">
              <table>
                <thead>
                  <tr>
                    <th class="${isAgentPrim ? 'sortable-th active-primary' : 'sortable-th'}">
                      <div class="th-content" style="align-items: flex-start;">
                        <span onclick="handleTeamSort('${teamName}', 'agent')">Agent Name</span>
                        <span class="sort-icon" onclick="handleTeamSort('${teamName}', 'agent')">${agentIcon}</span>
                      </div>
                    </th>
                    ${headersHtml}
                  </tr>
                </thead>
                <tbody>
                  ${tableRows}
                </tbody>
              </table>
            </div>
          </div>
        `;
        container.innerHTML += teamHtml;
      });

      document.getElementById('totAgents').innerText = gTotAgents;
      document.getElementById('totBooked').innerText = gTotBooked.toLocaleString();
      document.getElementById('totDone').innerText = gTotDone.toLocaleString();
      document.getElementById('totVideoCall').innerText = gTotVideoCall.toLocaleString();
      document.getElementById('totChkDoc').innerText = gTotChk.toLocaleString();
      document.getElementById('totFdb').innerText = gTotFdb.toLocaleString();
      document.getElementById('totConnFdb').innerText = gTotConnFdb.toLocaleString();
      document.getElementById('totImmFdb').innerText = gTotImmFdb.toLocaleString();
      document.getElementById('totConnImmFdb').innerText = gTotConnImmFdb.toLocaleString();
    }

    function openTeamFilterModal(teamName) {
      currentActiveTeamForFilter = teamName;
      document.getElementById('modalTeamTitle').innerText = `⚡ ${teamName}`;
      document.getElementById('modalTeamSubtitle').innerText = `Select agents to display in ${teamName}`;
      
      const container = document.getElementById('teamFilterListBody');
      container.innerHTML = '';

      const members = TEAMS[teamName] || [];
      members.forEach(agent => {
        const isChecked = !excludedAgents.has(agent) ? 'checked' : '';
        container.innerHTML += `
          <label class="agent-checkbox-label" data-name="${agent.toLowerCase()}">
            <input type="checkbox" class="team-agent-checkbox" value="${agent}" ${isChecked}>
            <span>${agent}</span>
          </label>
        `;
      });

      document.getElementById('teamAgentSearchBox').value = '';
      document.getElementById('filterModalOverlay').classList.add('open');
    }

    function closeTeamFilterModal() {
      document.getElementById('filterModalOverlay').classList.remove('open');
      currentActiveTeamForFilter = null;
    }

    function applyTeamFilter() {
      if (!currentActiveTeamForFilter) return;
      const checkboxes = document.querySelectorAll('.team-agent-checkbox');
      
      checkboxes.forEach(cb => {
        if (!cb.checked) {
          excludedAgents.add(cb.value);
        } else {
          excludedAgents.delete(cb.value);
        }
      });

      closeTeamFilterModal();
      renderDashboard();
    }

    function toggleTeamAll(selectAll) {
      const checkboxes = document.querySelectorAll('.team-agent-checkbox');
      checkboxes.forEach(cb => {
        const label = cb.closest('label');
        if (label.style.display !== 'none') {
          cb.checked = selectAll;
        }
      });
    }

    function searchTeamAgents() {
      const q = document.getElementById('teamAgentSearchBox').value.toLowerCase().trim();
      const labels = document.querySelectorAll('.agent-checkbox-label');
      labels.forEach(lbl => {
        const name = lbl.getAttribute('data-name');
        lbl.style.display = name.includes(q) ? 'flex' : 'none';
      });
    }

    renderDashboard();
  </script>
</body>
</html>
