<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agent Hourly Report - Unit 2</title>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif; 
      -webkit-font-smoothing: antialiased; 
    }
    
    body { 
      background-color: #f0fdf4; 
      background-image: radial-gradient(#bbf7d0 0.8px, transparent 0.8px);
      background-size: 16px 16px;
      color: #064e3b; 
      padding: 24px; 
    }
    
    /* Main Top Header Styling */
    header { 
      text-align: center; 
      margin-bottom: 24px; 
      padding: 28px 24px; 
      background: linear-gradient(135deg, #022c22 0%, #064e3b 60%, #0f5132 100%); 
      border-radius: 18px; 
      border: 1px solid #10b981; 
      box-shadow: 0 12px 30px -5px rgba(6, 78, 59, 0.35); 
      position: relative;
      overflow: hidden;
    }

    header::after {
      content: '';
      position: absolute;
      top: -50%;
      right: -20%;
      width: 300px;
      height: 300px;
      background: rgba(52, 211, 153, 0.08);
      border-radius: 50%;
      pointer-events: none;
    }
    
    h1 { 
      color: #ffffff; 
      font-size: 32px; 
      font-weight: 900; 
      letter-spacing: 1.2px; 
      text-transform: uppercase; 
      margin-bottom: 6px; 
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.3); 
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    h1 span.title-icon {
      font-size: 34px;
    }
    
    .header-subtitle {
      color: #34d399;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 22px;
    }
    
    .upload-container { display: flex; justify-content: center; align-items: center; gap: 15px; flex-wrap: wrap; }
    input[type="file"] { display: none; }
    .custom-file-upload { 
      background: linear-gradient(135deg, #059669 0%, #10b981 100%); 
      color: #ffffff; 
      padding: 12px 28px; 
      border-radius: 10px; 
      cursor: pointer; 
      font-weight: 800; 
      transition: all 0.2s ease; 
      box-shadow: 0 4px 16px rgba(16, 185, 129, 0.4); 
      text-transform: uppercase; 
      font-size: 13px; 
      letter-spacing: 0.8px; 
      border: 1px solid #6ee7b7; 
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .custom-file-upload:hover { 
      transform: translateY(-2px); 
      box-shadow: 0 6px 20px rgba(16, 185, 129, 0.5); 
      background: linear-gradient(135deg, #047857 0%, #059669 100%); 
    }
    .file-name { font-size: 13px; color: #a7f3d0; font-weight: 600; }
    
    /* Executive Score Card Grid */
    .summary-cards { 
      display: grid; 
      grid-template-columns: repeat(auto-fit, minmax(135px, 1fr)); 
      gap: 14px; 
      margin-bottom: 28px; 
    }
    
    .card { 
      background: linear-gradient(135deg, #022c22 0%, #064e3b 100%); 
      padding: 18px 10px; 
      border-radius: 14px; 
      border: 1px solid #065f46; 
      border-top: 5px solid #34d399; 
      text-align: center; 
      box-shadow: 0 8px 20px rgba(6, 78, 59, 0.25); 
      transition: transform 0.25s ease, box-shadow 0.25s ease; 
    }
    .card:hover { 
      transform: translateY(-4px); 
      box-shadow: 0 12px 26px rgba(6, 78, 59, 0.35); 
    }
    
    .card h3 { 
      font-size: 11px; 
      color: #a7f3d0; 
      text-transform: uppercase; 
      margin-bottom: 8px; 
      font-weight: 800; 
      letter-spacing: 0.6px; 
      line-height: 1.3;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }
    .card p { 
      font-size: 24px; 
      font-weight: 900; 
      color: #ffffff; 
      letter-spacing: -0.5px;
    }

    /* Team Table Container */
    .team-section { 
      background: #ffffff; 
      border-radius: 16px; 
      border: 2px solid #a7f3d0; 
      margin-bottom: 32px; 
      overflow: hidden; 
      box-shadow: 0 10px 25px rgba(6, 78, 59, 0.08); 
    }
    
    .team-header { 
      background: linear-gradient(135deg, #022c22 0%, #064e3b 100%); 
      padding: 16px 22px; 
      font-size: 18px; 
      font-weight: 900; 
      color: #ffffff; 
      letter-spacing: 1px; 
      border-bottom: 3px solid #10b981; 
      text-transform: uppercase; 
      display: flex;
      align-items: center;
      gap: 10px;
    }
    
    .table-responsive { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    
    th { 
      background-color: #064e3b; 
      color: #ecfdf5; 
      padding: 14px 10px; 
      font-weight: 800; 
      border-bottom: 3px solid #022c22; 
      border-right: 1.5px solid #047857; 
      text-transform: uppercase; 
      font-size: 12px; 
      text-align: center; 
      letter-spacing: 0.5px; 
    }
    th:first-child { text-align: left; padding-left: 18px; }
    th:last-child { border-right: none; }
    
    td { 
      padding: 12px 10px; 
      border-bottom: 1.5px solid #e2e8f0; 
      border-right: 1.5px solid #e2e8f0; 
      color: #0f172a; 
      font-weight: 800; 
      font-size: 14px; 
    }
    td:last-child { border-right: none; }
    
    tr:last-child td { border-bottom: none; }
    tr:nth-child(even) { background-color: #f0fdf4; }
    tr:nth-child(odd) { background-color: #ffffff; }
    tr:hover { background-color: #dcfce7; }
    
    .agent-name { font-weight: 800; color: #064e3b; text-align: left; padding-left: 18px; font-size: 14px; }
    .metric-val { text-align: center; font-size: 14px; color: #1e293b; font-weight: 800; }
    .metric-zero { color: #94a3b8; font-weight: 700; }
  </style>
</head>
<body>

  <header>
    <h1><span class="title-icon">⏱️</span> AGENT HOURLY REPORT</h1>
    <div class="header-subtitle">UNIT 2</div>
    <div class="upload-container">
      <label for="fileInput" class="custom-file-upload">
        📊 Upload Excel / CSV Data File
      </label>
      <input type="file" id="fileInput" accept=".csv, .xlsx, .xls">
      <span class="file-name" id="fileName">No file chosen</span>
    </div>
  </header>

  <div class="summary-cards" id="summaryCards">
    <div class="card"><h3>👥 Total Agents</h3><p id="totAgents">0</p></div>
    <div class="card"><h3>📋 Booked</h3><p id="totBooked">0</p></div>
    <div class="card"><h3>✅ Done</h3><p id="totDone">0</p></div>
    <div class="card"><h3>📹 Video Call</h3><p id="totVideoCall">0</p></div>
    <div class="card"><h3>🩺 Chk Doc</h3><p id="totChkDoc">0</p></div>
    <div class="card"><h3>💬 FDB</h3><p id="totFdb">0</p></div>
    <div class="card"><h3>📞 Conn FDB</h3><p id="totConnFdb">0</p></div>
    <div class="card"><h3>⚡ IMM FDB</h3><p id="totImmFdb">0</p></div>
    <div class="card"><h3>🎯 Conn IMM FDB</h3><p id="totConnImmFdb">0</p></div>
  </div>

  <div id="teamsContainer"></div>
