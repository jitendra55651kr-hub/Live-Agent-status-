<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agent Hourly Report - Unit 2</title>
  <!-- SheetJS for Excel/CSV Parsing -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; -webkit-font-smoothing: antialiased; }
    
    body { background-color: #f1f5f9; color: #0f172a; padding: 20px; }
    
    /* Main Top Header */
    header { 
      text-align: center; 
      margin-bottom: 25px; 
      padding: 26px 20px; 
      background: linear-gradient(135deg, #0b1329 0%, #1e293b 100%); 
      border-radius: 16px; 
      border: 1px solid #334155; 
      box-shadow: 0 12px 30px -5px rgba(15, 23, 42, 0.4); 
    }
    h1 { 
      color: #ffffff; 
      font-size: 34px; 
      font-weight: 900; 
      letter-spacing: 1.5px; 
      text-transform: uppercase; 
      margin-bottom: 4px; 
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.4); 
    }
    
    .header-subtitle {
      color: #38bdf8;
      font-size: 17px;
      font-weight: 900;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      margin-bottom: 22px;
    }
    
    /* Professional Upload Bar */
    .upload-container { 
      display: inline-flex; 
      justify-content: center; 
      align-items: center; 
      gap: 16px; 
      flex-wrap: wrap; 
      background: rgba(15, 23, 42, 0.6);
      padding: 8px 18px 8px 10px;
      border-radius: 50px;
      border: 1px solid rgba(56, 189, 248, 0.2);
      backdrop-filter: blur(8px);
      box-shadow: inset 0 1px 2px rgba(255, 255, 255, 0.05);
    }
    input[type="file"] { display: none; }
    
    .custom-file-upload { 
      background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%); 
      color: #ffffff; 
      padding: 11px 24px; 
      border-radius: 40px; 
      cursor: pointer; 
      font-weight: 800; 
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1); 
      box-shadow: 0 4px 18px rgba(37, 99, 235, 0.45); 
      text-transform: uppercase; 
      font-size: 13px; 
      letter-spacing: 1px; 
      border: 1px solid #60a5fa; 
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }
    .custom-file-upload:hover { 
      background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%); 
      transform: translateY(-2px); 
      box-shadow: 0 6px 22px rgba(37, 99, 235, 0.6);
      border-color: #93c5fd;
    }
    .custom-file-upload:active { transform: translateY(0); }
    .upload-icon { width: 18px; height: 18px; fill: currentColor; }

    .file-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: #cbd5e1;
      font-weight: 600;
      background: rgba(30, 41, 59, 0.8);
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid #334155;
    }
    .file-badge .file-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #94a3b8;
    }
    .file-badge.active .file-dot { background: #10b981; box-shadow: 0 0 8px #10b981; }
    .file-badge.active { color: #38bdf8; border-color: #0284c7; }

    /* Summary Cards */
    .summary-cards { 
      display: grid; 
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); 
      gap: 14px; 
      margin-bottom: 30px; 
    }
    
    .card { 
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); 
      padding: 18px 12px; 
      border-radius: 12px; 
      border: 1px solid #0f172a; 
      border-top: 5px solid #38bdf8; 
      text-align: center; 
      box-shadow: 0 6px 16px rgba(15, 23, 42, 0.3); 
      transition: transform 0.2s ease, box-shadow 0.2s ease; 
    }
    .card:hover { transform: translateY(-3px); box-shadow: 0 10px 22px rgba(15, 23, 42, 0.4); }
    
    .card h3 { 
      font-size: 13px; 
      color: #ffffff; 
      text-transform: uppercase; 
      margin-bottom: 10px; 
      font-weight: 800; 
      letter-spacing: 0.8px; 
      line-height: 1.2;
    }
    .card p { 
      font-size: 28px; 
      font-weight: 900; 
      color: #ffffff; 
    }

    /* Team Section */
    .team-section { 
      background: #ffffff; 
      border-radius: 14px; 
      border: 3px solid #334155; 
      margin-bottom: 30px; 
      overflow: hidden; 
      box-shadow: 0 8px 20px rgba(15, 23, 42, 0.12); 
    }
    
    .team-header { 
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); 
      padding: 16px 20px; 
      font-size: 20px; 
      font-weight: 900; 
      color: #ffffff; 
      letter-spacing: 1px; 
      border-bottom: 3px solid #334155; 
      text-transform: uppercase; 
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }
    
    .table-responsive { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    
    th { 
      background-color: #0f172a; 
      color: #ffffff; 
      padding: 13px 10px; 
      font-weight: 900; 
      border-bottom: 3px solid #334155; 
      border-right: 2.5px solid #334155; 
      text-transform: uppercase; 
      font-size: 13px; 
      text-align: center; 
      letter-spacing: 0.6px; 
      user-select: none;
    }
    th:first-child { text-align: left; padding-left: 16px; }
    th:last-child { border-right: none; }
    
    .sortable-th {
      cursor: pointer;
      transition: background 0.2s ease;
    }
    .sortable-th:hover {
      background-color: #1e293b;
    }
    .th-content {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .sort-icon {
      display: inline-block;
      padding: 2px 6px;
      font-size: 11px;
      background: #1e293b;
      border: 1px solid #475569;
      border-radius: 4px;
      color: #94a3b8;
    }
    .sortable-th.active-sort .sort-icon {
      background: #0284c7;
      color: #ffffff;
      border-color: #38bdf8;
      box-shadow: 0 0 6px rgba(56, 189, 248, 0.4);
    }

    /* Highly Styled Filter Button inside Table Header */
    .agent-filter-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      color: #ffffff;
      border: 1px solid #38bdf8;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 900;
      cursor: pointer;
      margin-left: 8px;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      box-shadow: 0 2px 8px rgba(2, 132, 199, 0.35);
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .agent-filter-btn:hover {
      background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%);
      color: #0f172a;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(56, 189, 248, 0.5);
    }
    
    td { 
      padding: 14px 12px; 
      border-bottom: 2.5px solid #475569; 
      border-right: 2.5px solid #475569; 
      color: #0f172a; 
      font-weight: 800; 
      font-size: 16px; 
    }
    td:last-child { border-right: none; }
    
    tr:last-child td { border-bottom: none; }
    tr:nth-child(even) { background-color: #f8fafc; }
    tr:nth-child(odd) { background-color: #ffffff; }
    tr:hover { background-color: #e0f2fe; }
    
    .agent-name { font-weight: 800; color: #0f172a; text-align: left; padding-left: 16px; font-size: 16px; }
    .metric-val { text-align: center; font-size: 17px; color: #0f172a; font-weight: 900; }

    /* Ultra-Modern Dark Modal Styling */
    .filter-modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 99999;
      justify-content: center;
      align-items: center;
      padding: 20px;
      animation: fadeInOverlay 0.25s ease forwards;
    }
    .filter-modal-overlay.open { display: flex; }

    @keyframes fadeInOverlay {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    
    .filter-modal-card {
      background: #0f172a;
      border-radius: 18px;
      max-width: 540px;
      width: 100%;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 25px 60px -10px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(56, 189, 248, 0.25);
      border: 1px solid #334155;
      overflow: hidden;
      animation: scaleUpModal 0.25s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    @keyframes scaleUpModal {
      from { transform: scale(0.92) translateY(10px); opacity: 0; }
      to { transform: scale(1) translateY(0); opacity: 1; }
    }
    
    .filter-modal-header {
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      padding: 20px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #334155;
    }
    .filter-header-left h2 { 
      font-size: 17px; 
      font-weight: 900; 
      color: #ffffff; 
      text-transform: uppercase; 
      letter-spacing: 1.2px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .filter-header-left p {
      font-size: 12px;
      color: #38bdf8;
      font-weight: 700;
      margin-top: 2px;
      letter-spacing: 0.5px;
    }
    .close-modal-btn {
      background: #1e293b;
      border: 1px solid #475569;
      color: #94a3b8;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .close-modal-btn:hover { 
      background: #ef4444; 
      color: #ffffff; 
      border-color: #ef4444; 
      transform: rotate(90deg); 
    }

    .filter-modal-tools {
      padding: 14px 24px;
      background: #162032;
      border-bottom: 1px solid #334155;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }
    .filter-search-box {
      flex: 1;
      min-width: 180px;
      padding: 9px 14px;
      background: #0f172a;
      border: 1.5px solid #334155;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      color: #ffffff;
      outline: none;
      transition: all 0.2s ease;
    }
    .filter-search-box:focus { border-color: #38bdf8; box-shadow: 0 0 10px rgba(56, 189, 248, 0.25); }
    .filter-search-box::placeholder { color: #64748b; }

    .quick-action-btn {
      background: #1e293b;
      border: 1px solid #475569;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
      color: #cbd5e1;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      transition: all 0.2s ease;
    }
    .quick-action-btn:hover { background: #334155; color: #ffffff; border-color: #38bdf8; }

    .filter-list-body {
      padding: 16px 24px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 380px;
    }
    .filter-list-body::-webkit-scrollbar { width: 6px; }
    .filter-list-body::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }

    .agent-checkbox-label {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 14px;
      font-weight: 700;
      color: #f1f5f9;
      cursor: pointer;
      padding: 10px 14px;
      background: #1e293b;
      border-radius: 10px;
      border: 1.5px solid #334155;
      transition: all 0.15s ease;
      user-select: none;
    }
    .agent-checkbox-label:hover { 
      background: #27354a; 
      border-color: #38bdf8;
      transform: translateX(3px);
    }
    .agent-checkbox-label input { 
      width: 19px; 
      height: 19px; 
      accent-color: #0284c7; 
      cursor: pointer; 
    }

    .filter-modal-footer {
      padding: 16px 24px;
      background: #162032;
      border-top: 1px solid #334155;
      display: flex;
      justify-content: flex-end;
      gap: 12px;
    }
    .cancel-btn {
      background: transparent;
      color: #94a3b8;
      border: 1px solid #475569;
      padding: 10px 18px;
      border-radius: 8px;
      font-weight: 800;
      font-size: 12px;
      text-transform: uppercase;
      cursor: pointer;
      letter-spacing: 0.8px;
      transition: all 0.2s ease;
    }
    .cancel-btn:hover { color: #ffffff; background: #1e293b; border-color: #64748b; }
    
    .apply-btn {
      background: linear-gradient(135deg, #0284c7 0%, #2563eb 100%);
      color: #ffffff;
      border: 1px solid #38bdf8;
      padding: 10px 24px;
      border-radius: 8px;
      font-weight: 800;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(2, 132, 199, 0.4);
      transition: all 0.2s ease;
    }
    .apply-btn:hover { 
      background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%); 
      color: #0f172a;
      transform: translateY(-1px);
    }
  </style>
</head>
<body>

  <header>
    <h1>AGENT HOURLY REPORT</h1>
    <div class="header-subtitle">UNIT 2</div>
    
    <div class="upload-container">
      <label for="fileInput" class="custom-file-upload">
        <svg class="upload-icon" viewBox="0 0 24 24">
          <path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z"/>
        </svg>
        Upload Excel / CSV File
      </label>
      <input type="file" id="fileInput" accept=".csv, .xlsx, .xls">
      
      <div class="file-badge" id="fileBadge">
        <span class="file-dot"></span>
        <span id="fileName">No file chosen</span>
      </div>
    </div>
  </header>

  <!-- Summary Cards -->
  <div class="summary-cards" id="summaryCards">
    <div class="card"><h3>Total Agents</h3><p id="totAgents">0</p></div>
    <div class="card"><h3>Book Consultation</h3><p id="totBooked">0</p></div>
    <div class="card"><h3>Done Consultation</h3><p id="totDone">0</p></div>
    <div class="card"><h3>Clinic Video Call</h3><p id="totVideoCall">0</p></div>
    <div class="card"><h3>Chk Doc</h3><p id="totChkDoc">0</p></div>
    <div class="card"><h3>FDB</h3><p id="totFdb">0</p></div>
    <div class="card"><h3>Connected FDB</h3><p id="totConnFdb">0</p></div>
    <div class="card"><h3>IMM FDB</h3><p id="totImmFdb">0</p></div>
    <div class="card"><h3>Connected IMM FDB</h3><p id="totConnImmFdb">0</p></div>
  </div>

  <div id="teamsContainer"></div>

  <!-- Strictly Team-Specific Filter Popup Modal -->
  <div class="filter-modal-overlay" id="filterModalOverlay">
    <div class="filter-modal-card">
      <div class="filter-modal-header">
        <div class="filter-header-left">
          <h2 id="modalTeamTitle">⚡ Filter Team Members</h2>
          <p id="modalTeamSubtitle">Show / Hide active agents</p>
        </div>
        <button class="close-modal-btn" onclick="closeTeamFilterModal()">&times;</button>
      </div>
      <div class="filter-modal-tools">
        <input type="text" class="filter-search-box" id="teamAgentSearchBox" placeholder="Search team member..." oninput="searchTeamAgents()">
        <button class="quick-action-btn" onclick="toggleTeamAll(true)">Select All</button>
        <button class="quick-action-btn" onclick="toggleTeamAll(false)">Unselect All</button>
      </div>
      <div class="filter-list-body" id="teamFilterListBody"></div>
      <div class="filter-modal-footer">
        <button class="cancel-btn" onclick="closeTeamFilterModal()">Cancel</button>
        <button class="apply-btn" onclick="applyTeamFilter()">Apply Filter</button>
      </div>
    </div>
  </div>

  <script>
    const TEAMS = {
      "TEAM JITENDRA": [
        "Saurav Pal", "Md anas", "Renu Gupta", "Shivam verma", 
        "Jogender singh", "Jayshree Choudhary", "Snigdha pal", 
        "Kiran thakur", "Vaishali sisodiya", "ANKUR KUMAR", "Rashi Gupta"
      ],
      "TEAM DEEPTI": [
        "Renu Rani", "Pooja Rathore", "ROSHNI PRAJAPATI", "GARVIT JHA", 
        "Rajni Saini", "Puja Chauhan", "Shivansh tiwari", "Saifur Janam", 
        "Anjali Gupta", "Roshni chouhan", "NIKITA YADAV"
      ],
      "TEAM RAVI": [
        "Jyoti Singh unit 2", "Rajendra Mourya", "Apurv Acharya", 
        "Amit Sharma", "Atul Kumar", "Sumit H", "Piyush Verma", 
        "Shivam Shukla", "Hitesh Kumar", "Samirun Nisha", "Abuzar Akhtar"
      ],
      "TEAM SHIVAM": [
        "Nandani", "Kamni Sharma", "Burhan", 
        "Chandrabhanu", "Munsi Sakil Ahmed", "Ashish Yadav", "Chandrabhanu Sukla",
        "MOHD SHAKIB", "Snehal Sukhadeo Gaikwad", "Kamni Muthoot"
      ],
      "TEAM ISHANT": [
        "Ayushi Saxena", "Harivansh Agarwal", 
        "Smruti Rani Sahoo", "Sushma Chaudhary", "Ashok Pawar", 
        "PRIYA PATIDAR", "YASHWANT SINGH", "Sanjana Khuswaha", "Isha mehta", "Rajesh ."
      ]
    };

    const SORTABLE_COLUMNS = [
      { key: 'booked', label: 'Book Consultation' },
      { key: 'done', label: 'Done Consultation' },
      { key: 'videocall', label: 'Clinic Video Call' },
      { key: 'chkdoc', label: 'Chk Doc' },
      { key: 'fdb', label: 'FDB' },
      { key: 'conn_fdb', label: 'Connected FDB' },
      { key: 'imm_fdb', label: 'IMM FDB' },
      { key: 'conn_imm_fdb', label: 'Connected IMM FDB' }
    ];

    let currentAgentStatsMap = {};
    let excludedAgents = new Set();
    let currentActiveTeamForFilter = null;

    // Independent team sort tracker
    const teamSortState = {};
    Object.keys(TEAMS).forEach(team => {
      teamSortState[team] = { key: 'imm_fdb', order: 'desc' };
    });

    document.getElementById('fileInput').addEventListener('change', handleFile);

    function handleFile(e) {
      const file = e.target.files[0];
      if (!file) return;
      
      const fileNameEl = document.getElementById('fileName');
      fileNameEl.innerText = file.name;
      document.getElementById('fileBadge').classList.add('active');

      const reader = new FileReader();
      reader.onload = function(evt) {
        const data = new Uint8Array(evt.target.result);
        const workbook = XLSX.read(data, { type: 'array' });
        const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
        const rawRows = XLSX.utils.sheet_to_json(firstSheet, { header: 1 });
        processData(rawRows);
      };
      reader.readAsArrayBuffer(file);
    }

    function cleanString(str) {
      if (!str) return '';
      return String(str).toLowerCase().replace(/[^a-z0-9]/g, '');
    }

    function processData(rows) {
      let headerRowIndex = -1;
      let colMap = {};

      for (let i = 0; i < Math.min(20, rows.length); i++) {
        const row = rows[i];
        if (!row) continue;
        
        row.forEach((cell, colIdx) => {
          const val = cleanString(cell);
          if (val === 'agent' || val === 'agentname' || val === 'name') colMap['agent'] = colIdx;
          if (val.includes('booked')) colMap['booked'] = colIdx;
          if (val.includes('done')) colMap['done'] = colIdx;
          if (val.includes('videocall') || val.includes('clinicvideo') || val === 'teledoc') colMap['videocall'] = colIdx;
          if (val.includes('chkdoc') || val.includes('checkdoc')) colMap['chkdoc'] = colIdx;
          
          if (val === 'immfdb') colMap['imm_fdb'] = colIdx;
          else if (val.includes('connectedimmfdb') || val.includes('connimm')) colMap['conn_imm_fdb'] = colIdx;
          else if (val.includes('connectedfdb') || val.includes('connected')) colMap['conn_fdb'] = colIdx;
          else if (val === 'fdb') colMap['fdb'] = colIdx;
        });

        if (colMap['agent'] !== undefined) {
          headerRowIndex = i;
          break;
        }
      }

      if (headerRowIndex === -1) {
        alert("Could not find 'Agent' column in the uploaded sheet.");
        return;
      }

      currentAgentStatsMap = {};

      for (let i = headerRowIndex + 1; i < rows.length; i++) {
        const row = rows[i];
        if (!row || !row[colMap['agent']]) continue;

        const rawName = String(row[colMap['agent']]).trim();
        const cleanName = cleanString(rawName);

        const getNum = (colKey) => {
          if (colMap[colKey] === undefined) return 0;
          const val = parseFloat(row[colMap[colKey]]);
          return isNaN(val) ? 0 : val;
        };

        currentAgentStatsMap[cleanName] = {
          displayName: rawName,
          booked: getNum('booked'),
          done: getNum('done'),
          videocall: getNum('videocall'),
          chkdoc: getNum('chkdoc'),
          fdb: getNum('fdb'),
          conn_fdb: getNum('conn_fdb'),
          imm_fdb: getNum('imm_fdb'),
          conn_imm_fdb: getNum('conn_imm_fdb')
        };
      }

      renderDashboard();
    }

    // Sort ONLY for the team clicked
    function handleTeamSort(teamName, key) {
      const state = teamSortState[teamName];
      if (state.key === key) {
        state.order = (state.order === 'desc') ? 'asc' : 'desc';
      } else {
        state.key = key;
        state.order = (key === 'agent') ? 'asc' : 'desc';
      }
      renderDashboard();
    }

    function renderDashboard() {
      const container = document.getElementById('teamsContainer');
      container.innerHTML = '';

      let gTotAgents = 0, gTotBooked = 0, gTotDone = 0, gTotVideoCall = 0, 
          gTotChk = 0, gTotFdb = 0, gTotConnFdb = 0, 
          gTotImmFdb = 0, gTotConnImmFdb = 0;

      Object.keys(TEAMS).forEach(teamName => {
        const members = TEAMS[teamName];
        const currentSort = teamSortState[teamName];

        const headersHtml = SORTABLE_COLUMNS.map(col => {
          const isActive = currentSort.key === col.key;
          const icon = isActive ? (currentSort.order === 'desc' ? '▼ HIGH' : '▲ LOW') : '⇅';
          const activeClass = isActive ? 'sortable-th active-sort' : 'sortable-th';
          return `
            <th class="${activeClass}" onclick="handleTeamSort('${teamName}', '${col.key}')">
              <div class="th-content">
                <span>${col.label}</span>
                <span class="sort-icon">${icon}</span>
              </div>
            </th>
          `;
        }).join('');

        const isAgentSort = currentSort.key === 'agent';
        const agentIcon = isAgentSort ? (currentSort.order === 'asc' ? '▲ A-Z' : '▼ Z-A') : '⇅';

        // Filter out excluded agents
        const visibleMembers = members.filter(m => !excludedAgents.has(m));

        let teamData = visibleMembers.map(member => {
          gTotAgents++;
          const cleanMem = cleanString(member);
          let stats = currentAgentStatsMap[cleanMem];

          if (!stats) {
            const key = Object.keys(currentAgentStatsMap).find(k => {
              const cleanMemAlt = cleanMem.replace('saurabh', 'saurav');
              const kAlt = k.replace('saurabh', 'saurav');
              return k.includes(cleanMem) || cleanMem.includes(k) || kAlt.includes(cleanMemAlt) || cleanMemAlt.includes(kAlt);
            });
            if (key) stats = currentAgentStatsMap[key];
          }

          const s = stats || {
            booked: 0, done: 0, videocall: 0, 
            chkdoc: 0, fdb: 0, conn_fdb: 0, imm_fdb: 0, conn_imm_fdb: 0
          };

          return { name: member, stats: s };
        });

        // Blanks & 0s always remain at the bottom
        teamData.sort((a, b) => {
          if (currentSort.key === 'agent') {
            return currentSort.order === 'asc' 
              ? a.name.localeCompare(b.name) 
              : b.name.localeCompare(a.name);
          }

          const valA = Number(a.stats[currentSort.key]) || 0;
          const valB = Number(b.stats[currentSort.key]) || 0;

          if (valA === 0 && valB === 0) return a.name.localeCompare(b.name);
          if (valA === 0) return 1;
          if (valB === 0) return -1;

          return currentSort.order === 'desc' ? (valB - valA) : (valA - valB);
        });

        let tableRows = '';
        teamData.forEach(item => {
          const member = item.name;
          const s = item.stats;

          gTotBooked += s.booked;
          gTotDone += s.done;
          gTotVideoCall += s.videocall;
          gTotChk += s.chkdoc;
          gTotFdb += s.fdb;
          gTotConnFdb += s.conn_fdb;
          gTotImmFdb += s.imm_fdb;
          gTotConnImmFdb += s.conn_imm_fdb;

          const fmt = (val) => (!val || val === 0) ? '' : val;

          tableRows += `
            <tr>
              <td class="agent-name">${member}</td>
              <td class="metric-val">${fmt(s.booked)}</td>
              <td class="metric-val">${fmt(s.done)}</td>
              <td class="metric-val">${fmt(s.videocall)}</td>
              <td class="metric-val">${fmt(s.chkdoc)}</td>
              <td class="metric-val">${fmt(s.fdb)}</td>
              <td class="metric-val">${fmt(s.conn_fdb)}</td>
              <td class="metric-val">${fmt(s.imm_fdb)}</td>
              <td class="metric-val">${fmt(s.conn_imm_fdb)}</td>
            </tr>
          `;
        });

        const teamHtml = `
          <div class="team-section">
            <div class="team-header">
              <span>${teamName} (${teamData.length}/${members.length})</span>
              <button type="button" class="agent-filter-btn" onclick="openTeamFilterModal('${teamName}')">
                ⚡ Filter Agents
              </button>
            </div>
            <div class="table-responsive">
              <table>
                <thead>
                  <tr>
                    <th class="${isAgentSort ? 'sortable-th active-sort' : 'sortable-th'}">
                      <div class="th-content" style="justify-content: flex-start;">
                        <span onclick="handleTeamSort('${teamName}', 'agent')">Agent Name</span>
                        <span class="sort-icon" onclick="handleTeamSort('${teamName}', 'agent')">${agentIcon}</span>
                      </div>
                    </th>
                    ${headersHtml}
                  </tr>
                </thead>
                <tbody>
                  ${tableRows}
                </tbody>
              </table>
            </div>
          </div>
        `;
        container.innerHTML += teamHtml;
      });

      // Update Summary Cards
      document.getElementById('totAgents').innerText = gTotAgents;
      document.getElementById('totBooked').innerText = gTotBooked.toLocaleString();
      document.getElementById('totDone').innerText = gTotDone.toLocaleString();
      document.getElementById('totVideoCall').innerText = gTotVideoCall.toLocaleString();
      document.getElementById('totChkDoc').innerText = gTotChk.toLocaleString();
      document.getElementById('totFdb').innerText = gTotFdb.toLocaleString();
      document.getElementById('totConnFdb').innerText = gTotConnFdb.toLocaleString();
      document.getElementById('totImmFdb').innerText = gTotImmFdb.toLocaleString();
      document.getElementById('totConnImmFdb').innerText = gTotConnImmFdb.toLocaleString();
    }

    // Modal Operations (Strictly single team)
    function openTeamFilterModal(teamName) {
      currentActiveTeamForFilter = teamName;
      document.getElementById('modalTeamTitle').innerText = `⚡ ${teamName}`;
      document.getElementById('modalTeamSubtitle').innerText = `Select agents to display in ${teamName}`;
      
      const container = document.getElementById('teamFilterListBody');
      container.innerHTML = '';

      // ONLY load this team's members
      const members = TEAMS[teamName] || [];
      members.forEach(agent => {
        const isChecked = !excludedAgents.has(agent) ? 'checked' : '';
        container.innerHTML += `
          <label class="agent-checkbox-label" data-name="${agent.toLowerCase()}">
            <input type="checkbox" class="team-agent-checkbox" value="${agent}" ${isChecked}>
            <span>${agent}</span>
          </label>
        `;
      });

      document.getElementById('teamAgentSearchBox').value = '';
      document.getElementById('filterModalOverlay').classList.add('open');
    }

    function closeTeamFilterModal() {
      document.getElementById('filterModalOverlay').classList.remove('open');
      currentActiveTeamForFilter = null;
    }

    function applyTeamFilter() {
      if (!currentActiveTeamForFilter) return;
      const checkboxes = document.querySelectorAll('.team-agent-checkbox');
      
      checkboxes.forEach(cb => {
        if (!cb.checked) {
          excludedAgents.add(cb.value);
        } else {
          excludedAgents.delete(cb.value);
        }
      });

      closeTeamFilterModal();
      renderDashboard();
    }

    function toggleTeamAll(selectAll) {
      const checkboxes = document.querySelectorAll('.team-agent-checkbox');
      checkboxes.forEach(cb => {
        const label = cb.closest('label');
        if (label.style.display !== 'none') {
          cb.checked = selectAll;
        }
      });
    }

    function searchTeamAgents() {
      const q = document.getElementById('teamAgentSearchBox').value.toLowerCase().trim();
      const labels = document.querySelectorAll('.agent-checkbox-label');
      labels.forEach(lbl => {
        const name = lbl.getAttribute('data-name');
        lbl.style.display = name.includes(q) ? 'flex' : 'none';
      });
    }

    renderDashboard();
  </script>
</body>
</html>
