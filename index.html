<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agent Hourly Report - Unit 2</title>
  <!-- SheetJS for Excel/CSV Parsing -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; -webkit-font-smoothing: antialiased; }
    
    body { background-color: #f1f5f9; color: #0f172a; padding: 20px; }
    
    /* Main Top Header */
    header { 
      text-align: center; 
      margin-bottom: 25px; 
      padding: 24px 20px; 
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); 
      border-radius: 14px; 
      border: 1px solid #334155; 
      box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.25); 
    }
    h1 { 
      color: #ffffff; 
      font-size: 32px; 
      font-weight: 900; 
      letter-spacing: 1.5px; 
      text-transform: uppercase; 
      margin-bottom: 4px; 
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2); 
    }
    
    .header-subtitle {
      color: #38bdf8;
      font-size: 18px;
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 18px;
    }
    
    .upload-container { display: flex; justify-content: center; align-items: center; gap: 15px; flex-wrap: wrap; }
    input[type="file"] { display: none; }
    .custom-file-upload { 
      background: #2563eb; 
      color: #ffffff; 
      padding: 12px 28px; 
      border-radius: 8px; 
      cursor: pointer; 
      font-weight: 800; 
      transition: all 0.2s ease; 
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.4); 
      text-transform: uppercase; 
      font-size: 14px; 
      letter-spacing: 0.8px; 
      border: 1px solid #60a5fa; 
    }
    .custom-file-upload:hover { background: #1d4ed8; transform: translateY(-1px); }
    .file-name { font-size: 14px; color: #cbd5e1; font-weight: 600; }

    .header-filter-btn {
      background: #0369a1;
      color: #ffffff;
      border: 1px solid #38bdf8;
      padding: 12px 22px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 800;
      font-size: 13px;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .header-filter-btn:hover { background: #0284c7; transform: translateY(-1px); }

    /* Summary Cards */
    .summary-cards { 
      display: grid; 
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); 
      gap: 14px; 
      margin-bottom: 30px; 
    }
    
    .card { 
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); 
      padding: 18px 12px; 
      border-radius: 12px; 
      border: 1px solid #0f172a; 
      border-top: 5px solid #38bdf8; 
      text-align: center; 
      box-shadow: 0 6px 16px rgba(15, 23, 42, 0.3); 
      transition: transform 0.2s ease, box-shadow 0.2s ease; 
    }
    .card:hover { transform: translateY(-3px); box-shadow: 0 10px 22px rgba(15, 23, 42, 0.4); }
    
    .card h3 { 
      font-size: 13px; 
      color: #ffffff; 
      text-transform: uppercase; 
      margin-bottom: 10px; 
      font-weight: 800; 
      letter-spacing: 0.8px; 
      line-height: 1.2;
    }
    .card p { 
      font-size: 28px; 
      font-weight: 900; 
      color: #ffffff; 
    }

    /* Team Section */
    .team-section { 
      background: #ffffff; 
      border-radius: 12px; 
      border: 3px solid #334155; 
      margin-bottom: 30px; 
      overflow: hidden; 
      box-shadow: 0 6px 16px rgba(15, 23, 42, 0.12); 
    }
    
    .team-header { 
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); 
      padding: 16px 20px; 
      font-size: 22px; 
      font-weight: 900; 
      color: #ffffff; 
      letter-spacing: 1px; 
      border-bottom: 3px solid #334155; 
      text-transform: uppercase; 
    }
    
    .table-responsive { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    
    th { 
      background-color: #0f172a; 
      color: #ffffff; 
      padding: 12px 10px; 
      font-weight: 900; 
      border-bottom: 3px solid #334155; 
      border-right: 2.5px solid #334155; 
      text-transform: uppercase; 
      font-size: 13px; 
      text-align: center; 
      letter-spacing: 0.6px; 
      user-select: none;
    }
    th:first-child { text-align: left; padding-left: 16px; }
    th:last-child { border-right: none; }
    
    .sortable-th {
      cursor: pointer;
      transition: background 0.2s ease;
    }
    .sortable-th:hover {
      background-color: #1e293b;
    }
    .th-content {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .sort-icon {
      display: inline-block;
      padding: 2px 6px;
      font-size: 11px;
      background: #1e293b;
      border: 1px solid #475569;
      border-radius: 4px;
      color: #94a3b8;
    }
    .sortable-th.active-sort .sort-icon {
      background: #0284c7;
      color: #ffffff;
      border-color: #38bdf8;
      box-shadow: 0 0 6px rgba(56, 189, 248, 0.4);
    }

    /* In-Table Agent Filter Trigger Button */
    .agent-filter-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: #1e293b;
      color: #38bdf8;
      border: 1px solid #38bdf8;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 11px;
      cursor: pointer;
      margin-left: 6px;
      transition: all 0.15s ease;
    }
    .agent-filter-pill:hover {
      background: #38bdf8;
      color: #0f172a;
    }
    
    td { 
      padding: 14px 12px; 
      border-bottom: 2.5px solid #475569; 
      border-right: 2.5px solid #475569; 
      color: #0f172a; 
      font-weight: 800; 
      font-size: 16px; 
    }
    td:last-child { border-right: none; }
    
    tr:last-child td { border-bottom: none; }
    tr:nth-child(even) { background-color: #f8fafc; }
    tr:nth-child(odd) { background-color: #ffffff; }
    tr:hover { background-color: #e0f2fe; }
    
    .agent-name { font-weight: 800; color: #0f172a; text-align: left; padding-left: 16px; font-size: 16px; }
    .metric-val { text-align: center; font-size: 17px; color: #0f172a; font-weight: 900; }

    /* Filter Modal */
    .filter-modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(4px);
      z-index: 9999;
      justify-content: center;
      align-items: center;
      padding: 15px;
    }
    .filter-modal-overlay.open { display: flex; }
    
    .filter-modal-card {
      background: #ffffff;
      border-radius: 14px;
      max-width: 650px;
      width: 100%;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 40px rgba(15, 23, 42, 0.35);
      border: 2px solid #334155;
      overflow: hidden;
    }
    
    .filter-modal-header {
      background: #0f172a;
      color: #ffffff;
      padding: 18px 22px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .filter-modal-header h2 { font-size: 18px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; }
    .close-modal-btn {
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 26px;
      cursor: pointer;
      line-height: 1;
    }
    .close-modal-btn:hover { color: #ffffff; }

    .filter-modal-tools {
      padding: 14px 20px;
      background: #f8fafc;
      border-bottom: 1px solid #cbd5e1;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
    }
    .filter-search-box {
      flex: 1;
      padding: 8px 12px;
      border: 1.5px solid #cbd5e1;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      outline: none;
    }
    .filter-search-box:focus { border-color: #2563eb; }

    .quick-action-btn {
      background: #ffffff;
      border: 1.5px solid #cbd5e1;
      padding: 7px 14px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      color: #334155;
    }
    .quick-action-btn:hover { background: #e2e8f0; color: #0f172a; }

    .filter-list-body {
      padding: 15px 20px;
      overflow-y: auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 10px;
    }
    .agent-checkbox-label {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      font-weight: 700;
      color: #1e293b;
      cursor: pointer;
      padding: 8px 10px;
      background: #f1f5f9;
      border-radius: 6px;
      transition: background 0.15s ease;
    }
    .agent-checkbox-label:hover { background: #e2e8f0; }
    .agent-checkbox-label input { width: 17px; height: 17px; accent-color: #2563eb; cursor: pointer; }

    .filter-modal-footer {
      padding: 14px 20px;
      background: #f8fafc;
      border-top: 1px solid #cbd5e1;
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }
    .apply-btn {
      background: #2563eb;
      color: #ffffff;
      border: none;
      padding: 9px 22px;
      border-radius: 6px;
      font-weight: 800;
      font-size: 13px;
      text-transform: uppercase;
      cursor: pointer;
    }
    .apply-btn:hover { background: #1d4ed8; }
  </style>
</head>
<body>

  <header>
    <h1>AGENT HOURLY REPORT</h1>
    <div class="header-subtitle">UNIT 2</div>
    <div class="upload-container">
      <label for="fileInput" class="custom-file-upload">
        📁 Upload Excel / CSV File
      </label>
      <input type="file" id="fileInput" accept=".csv, .xlsx, .xls">
      
      <button class="header-filter-btn" onclick="openAgentFilterModal()">
        ⚡ Filter Agents (<span id="activeAgentCountDisplay">All</span>)
      </button>

      <span class="file-name" id="fileName">No file chosen</span>
    </div>
  </header>

  <!-- Summary Cards -->
  <div class="summary-cards" id="summaryCards">
    <div class="card"><h3>Total Agents</h3><p id="totAgents">0</p></div>
    <div class="card"><h3>Book Consultation</h3><p id="totBooked">0</p></div>
    <div class="card"><h3>Done Consultation</h3><p id="totDone">0</p></div>
    <div class="card"><h3>Clinic Video Call</h3><p id="totVideoCall">0</p></div>
    <div class="card"><h3>Chk Doc</h3><p id="totChkDoc">0</p></div>
    <div class="card"><h3>FDB</h3><p id="totFdb">0</p></div>
    <div class="card"><h3>Connected FDB</h3><p id="totConnFdb">0</p></div>
    <div class="card"><h3>IMM FDB</h3><p id="totImmFdb">0</p></div>
    <div class="card"><h3>Connected IMM FDB</h3><p id="totConnImmFdb">0</p></div>
  </div>

  <div id="teamsContainer"></div>

  <!-- Filter Modal -->
  <div class="filter-modal-overlay" id="filterModalOverlay">
    <div class="filter-modal-card">
      <div class="filter-modal-header">
        <h2>Select Visible Agents</h2>
        <button class="close-modal-btn" onclick="closeAgentFilterModal()">&times;</button>
      </div>
      <div class="filter-modal-tools">
        <input type="text" class="filter-search-box" id="agentSearchBox" placeholder="Search agent name..." oninput="searchFilterAgents()">
        <button class="quick-action-btn" onclick="toggleAllAgents(true)">Select All</button>
        <button class="quick-action-btn" onclick="toggleAllAgents(false)">Unselect All</button>
      </div>
      <div class="filter-list-body" id="filterListBody"></div>
      <div class="filter-modal-footer">
        <button class="apply-btn" onclick="applyAgentFilter()">Apply & Close</button>
      </div>
    </div>
  </div>

  <script>
    const TEAMS = {
      "TEAM JITENDRA": [
        "Saurav Pal", "Md anas", "Renu Gupta", "Shivam verma", 
        "Jogender singh", "Jayshree Choudhary", "Snigdha pal", 
        "Kiran thakur", "Vaishali sisodiya", "ANKUR KUMAR", "Rashi Gupta"
      ],
      "TEAM DEEPTI": [
        "Renu Rani", "Pooja Rathore", "ROSHNI PRAJAPATI", "GARVIT JHA", 
        "Rajni Saini", "Puja Chauhan", "Shivansh tiwari", "Saifur Janam", 
        "Anjali Gupta", "Roshni chouhan", "NIKITA YADAV"
      ],
      "TEAM RAVI": [
        "Jyoti Singh unit 2", "Rajendra Mourya", "Apurv Acharya", 
        "Amit Sharma", "Atul Kumar", "Sumit H", "Piyush Verma", 
        "Shivam Shukla", "Hitesh Kumar", "Samirun Nisha", "Abuzar Akhtar"
      ],
      "TEAM SHIVAM": [
        "Nandani", "Kamni Sharma", "Burhan", 
        "Chandrabhanu", "Munsi Sakil Ahmed", "Ashish Yadav", "Chandrabhanu Sukla",
        "MOHD SHAKIB", "Snehal Sukhadeo Gaikwad", "Kamni Muthoot"
      ],
      "TEAM ISHANT": [
        "Ayushi Saxena", "Harivansh Agarwal", 
        "Smruti Rani Sahoo", "Sushma Chaudhary", "Ashok Pawar", 
        "PRIYA PATIDAR", "YASHWANT SINGH", "Sanjana Khuswaha", "Isha mehta", "Rajesh ."
      ]
    };

    const SORTABLE_COLUMNS = [
      { key: 'booked', label: 'Book Consultation' },
      { key: 'done', label: 'Done Consultation' },
      { key: 'videocall', label: 'Clinic Video Call' },
      { key: 'chkdoc', label: 'Chk Doc' },
      { key: 'fdb', label: 'FDB' },
      { key: 'conn_fdb', label: 'Connected FDB' },
      { key: 'imm_fdb', label: 'IMM FDB' },
      { key: 'conn_imm_fdb', label: 'Connected IMM FDB' }
    ];

    let currentAgentStatsMap = {};
    let excludedAgents = new Set();
    let currentSortKey = 'imm_fdb'; 
    let currentSortOrder = 'desc'; // 'desc' or 'asc'

    document.getElementById('fileInput').addEventListener('change', handleFile);

    function handleFile(e) {
      const file = e.target.files[0];
      if (!file) return;
      document.getElementById('fileName').innerText = file.name;

      const reader = new FileReader();
      reader.onload = function(evt) {
        const data = new Uint8Array(evt.target.result);
        const workbook = XLSX.read(data, { type: 'array' });
        const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
        const rawRows = XLSX.utils.sheet_to_json(firstSheet, { header: 1 });
        processData(rawRows);
      };
      reader.readAsArrayBuffer(file);
    }

    function cleanString(str) {
      if (!str) return '';
      return String(str).toLowerCase().replace(/[^a-z0-9]/g, '');
    }

    function processData(rows) {
      let headerRowIndex = -1;
      let colMap = {};

      for (let i = 0; i < Math.min(20, rows.length); i++) {
        const row = rows[i];
        if (!row) continue;
        
        row.forEach((cell, colIdx) => {
          const val = cleanString(cell);
          if (val === 'agent' || val === 'agentname' || val === 'name') colMap['agent'] = colIdx;
          if (val.includes('booked')) colMap['booked'] = colIdx;
          if (val.includes('done')) colMap['done'] = colIdx;
          if (val.includes('videocall') || val.includes('clinicvideo') || val === 'teledoc') colMap['videocall'] = colIdx;
          if (val.includes('chkdoc') || val.includes('checkdoc')) colMap['chkdoc'] = colIdx;
          
          if (val === 'immfdb') colMap['imm_fdb'] = colIdx;
          else if (val.includes('connectedimmfdb') || val.includes('connimm')) colMap['conn_imm_fdb'] = colIdx;
          else if (val.includes('connectedfdb') || val.includes('connected')) colMap['conn_fdb'] = colIdx;
          else if (val === 'fdb') colMap['fdb'] = colIdx;
        });

        if (colMap['agent'] !== undefined) {
          headerRowIndex = i;
          break;
        }
      }

      if (headerRowIndex === -1) {
        alert("Could not find 'Agent' column in the uploaded sheet.");
        return;
      }

      currentAgentStatsMap = {};

      for (let i = headerRowIndex + 1; i < rows.length; i++) {
        const row = rows[i];
        if (!row || !row[colMap['agent']]) continue;

        const rawName = String(row[colMap['agent']]).trim();
        const cleanName = cleanString(rawName);

        const getNum = (colKey) => {
          if (colMap[colKey] === undefined) return 0;
          const val = parseFloat(row[colMap[colKey]]);
          return isNaN(val) ? 0 : val;
        };

        currentAgentStatsMap[cleanName] = {
          displayName: rawName,
          booked: getNum('booked'),
          done: getNum('done'),
          videocall: getNum('videocall'),
          chkdoc: getNum('chkdoc'),
          fdb: getNum('fdb'),
          conn_fdb: getNum('conn_fdb'),
          imm_fdb: getNum('imm_fdb'),
          conn_imm_fdb: getNum('conn_imm_fdb')
        };
      }

      renderDashboard();
    }

    function handleSortClick(key) {
      if (currentSortKey === key) {
        currentSortOrder = (currentSortOrder === 'desc') ? 'asc' : 'desc';
      } else {
        currentSortKey = key;
        currentSortOrder = (key === 'agent') ? 'asc' : 'desc';
      }
      renderDashboard();
    }

    function renderDashboard() {
      const container = document.getElementById('teamsContainer');
      container.innerHTML = '';

      let gTotAgents = 0, gTotBooked = 0, gTotDone = 0, gTotVideoCall = 0, 
          gTotChk = 0, gTotFdb = 0, gTotConnFdb = 0, 
          gTotImmFdb = 0, gTotConnImmFdb = 0;

      const renderHeaders = () => {
        return SORTABLE_COLUMNS.map(col => {
          const isActive = currentSortKey === col.key;
          const icon = isActive ? (currentSortOrder === 'desc' ? '▼ HIGH' : '▲ LOW') : '⇅';
          const activeClass = isActive ? 'sortable-th active-sort' : 'sortable-th';
          return `
            <th class="${activeClass}" onclick="handleSortClick('${col.key}')">
              <div class="th-content">
                <span>${col.label}</span>
                <span class="sort-icon">${icon}</span>
              </div>
            </th>
          `;
        }).join('');
      };

      const isAgentActive = currentSortKey === 'agent';
      const agentSortIcon = isAgentActive ? (currentSortOrder === 'asc' ? '▲ A-Z' : '▼ Z-A') : '⇅';

      Object.keys(TEAMS).forEach(teamName => {
        const members = TEAMS[teamName];
        let tableRows = '';

        const visibleMembers = members.filter(m => !excludedAgents.has(m));

        let teamData = visibleMembers.map(member => {
          gTotAgents++;
          const cleanMem = cleanString(member);
          let stats = currentAgentStatsMap[cleanMem];

          if (!stats) {
            const key = Object.keys(currentAgentStatsMap).find(k => {
              const cleanMemAlt = cleanMem.replace('saurabh', 'saurav');
              const kAlt = k.replace('saurabh', 'saurav');
              return k.includes(cleanMem) || cleanMem.includes(k) || kAlt.includes(cleanMemAlt) || cleanMemAlt.includes(kAlt);
            });
            if (key) stats = currentAgentStatsMap[key];
          }

          const s = stats || {
            booked: 0, done: 0, videocall: 0, 
            chkdoc: 0, fdb: 0, conn_fdb: 0, imm_fdb: 0, conn_imm_fdb: 0
          };

          return { name: member, stats: s };
        });

        // Smart Sorting: Blanks & 0s Always Stay At The Bottom
        teamData.sort((a, b) => {
          if (currentSortKey === 'agent') {
            return currentSortOrder === 'asc' 
              ? a.name.localeCompare(b.name) 
              : b.name.localeCompare(a.name);
          }

          const valA = Number(a.stats[currentSortKey]) || 0;
          const valB = Number(b.stats[currentSortKey]) || 0;

          // Dono zero/blank hain toh alphabetical
          if (valA === 0 && valB === 0) return a.name.localeCompare(b.name);
          // Zero/Blank hamesha bottom me bhejo
          if (valA === 0) return 1;
          if (valB === 0) return -1;

          // Actual values par sorting
          return currentSortOrder === 'desc' ? (valB - valA) : (valA - valB);
        });

        teamData.forEach(item => {
          const member = item.name;
          const s = item.stats;

          gTotBooked += s.booked;
          gTotDone += s.done;
          gTotVideoCall += s.videocall;
          gTotChk += s.chkdoc;
          gTotFdb += s.fdb;
          gTotConnFdb += s.conn_fdb;
          gTotImmFdb += s.imm_fdb;
          gTotConnImmFdb += s.conn_imm_fdb;

          const fmt = (val) => (!val || val === 0) ? '' : val;

          tableRows += `
            <tr>
              <td class="agent-name">${member}</td>
              <td class="metric-val">${fmt(s.booked)}</td>
              <td class="metric-val">${fmt(s.done)}</td>
              <td class="metric-val">${fmt(s.videocall)}</td>
              <td class="metric-val">${fmt(s.chkdoc)}</td>
              <td class="metric-val">${fmt(s.fdb)}</td>
              <td class="metric-val">${fmt(s.conn_fdb)}</td>
              <td class="metric-val">${fmt(s.imm_fdb)}</td>
              <td class="metric-val">${fmt(s.conn_imm_fdb)}</td>
            </tr>
          `;
        });

        const teamHtml = `
          <div class="team-section">
            <div class="team-header">${teamName} (${teamData.length})</div>
            <div class="table-responsive">
              <table>
                <thead>
                  <tr>
                    <th class="${isAgentActive ? 'sortable-th active-sort' : 'sortable-th'}">
                      <div class="th-content" style="justify-content: flex-start;">
                        <span onclick="handleSortClick('agent')">Agent Name</span>
                        <span class="sort-icon" onclick="handleSortClick('agent')">${agentSortIcon}</span>
                        <button type="button" class="agent-filter-pill" onclick="openAgentFilterModal()">⚡ Filter</button>
                      </div>
                    </th>
                    ${renderHeaders()}
                  </tr>
                </thead>
                <tbody>
                  ${tableRows}
                </tbody>
              </table>
            </div>
          </div>
        `;
        container.innerHTML += teamHtml;
      });

      // Update Summary Cards
      document.getElementById('totAgents').innerText = gTotAgents;
      document.getElementById('totBooked').innerText = gTotBooked.toLocaleString();
      document.getElementById('totDone').innerText = gTotDone.toLocaleString();
      document.getElementById('totVideoCall').innerText = gTotVideoCall.toLocaleString();
      document.getElementById('totChkDoc').innerText = gTotChk.toLocaleString();
      document.getElementById('totFdb').innerText = gTotFdb.toLocaleString();
      document.getElementById('totConnFdb').innerText = gTotConnFdb.toLocaleString();
      document.getElementById('totImmFdb').innerText = gTotImmFdb.toLocaleString();
      document.getElementById('totConnImmFdb').innerText = gTotConnImmFdb.toLocaleString();

      const totalConfiguredAgents = Object.values(TEAMS).flat().length;
      document.getElementById('activeAgentCountDisplay').innerText = `${totalConfiguredAgents - excludedAgents.size}/${totalConfiguredAgents}`;
    }

    // Filter Modal Handling
    function openAgentFilterModal() {
      const container = document.getElementById('filterListBody');
      container.innerHTML = '';

      Object.keys(TEAMS).forEach(team => {
        TEAMS[team].forEach(agent => {
          const isChecked = !excludedAgents.has(agent) ? 'checked' : '';
          container.innerHTML += `
            <label class="agent-checkbox-label" data-name="${agent.toLowerCase()}">
              <input type="checkbox" class="agent-checkbox" value="${agent}" ${isChecked}>
              <span>${agent} <small style="color:#64748b;">(${team})</small></span>
            </label>
          `;
        });
      });

      document.getElementById('agentSearchBox').value = '';
      document.getElementById('filterModalOverlay').classList.add('open');
    }

    function closeAgentFilterModal() {
      document.getElementById('filterModalOverlay').classList.remove('open');
    }

    function applyAgentFilter() {
      const checkboxes = document.querySelectorAll('.agent-checkbox');
      excludedAgents.clear();
      checkboxes.forEach(cb => {
        if (!cb.checked) excludedAgents.add(cb.value);
      });
      closeAgentFilterModal();
      renderDashboard();
    }

    function toggleAllAgents(selectAll) {
      const checkboxes = document.querySelectorAll('.agent-checkbox');
      checkboxes.forEach(cb => {
        const label = cb.closest('label');
        if (label.style.display !== 'none') {
          cb.checked = selectAll;
        }
      });
    }

    function searchFilterAgents() {
      const q = document.getElementById('agentSearchBox').value.toLowerCase().trim();
      const labels = document.querySelectorAll('.agent-checkbox-label');
      labels.forEach(lbl => {
        const name = lbl.getAttribute('data-name');
        lbl.style.display = name.includes(q) ? 'flex' : 'none';
      });
    }

    renderDashboard();
  </script>
</body>
</html>
